<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Logo Militansi Perempuan Indonesia (MPI) GMPI">
<title>Logo Militansi Perempuan Indonesia (MPI) GMPI</title>
<style>.spin{transform-origin:100px 100px;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ring{font:700 12.5px Impact,'Arial Narrow',Arial,sans-serif;letter-spacing:2.6px;fill:#f3dfa6}</style>
