<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page{ size:200cm 100cm; margin:0; }
  html,body{ margin:0; padding:0; width:200cm; height:100cm; overflow:hidden; }
  body{
    position:relative;
    background:#000 url('assets/papan-frame-eksklusif.png') center/cover no-repeat;
    font-family:'Liberation Serif',Georgia,'Times New Roman',serif;
  }
  .biasa{ position:absolute; inset:17cm 25cm 18cm; background:radial-gradient(closest-side, rgba(214,178,76,.07), transparent 78%); }
  .fil{ position:absolute; width:6.5cm; height:6.5cm; }
  .fil path{ fill:none; stroke:#d9b24c; }
  .tl{ left:33.2cm;  top:20.3cm; }
  .tr{ right:33.2cm; top:20.3cm; transform:scaleX(-1); }
  .bl{ left:33.2cm;  bottom:21.1cm; transform:scaleY(-1); }
  .br{ right:33.2cm; bottom:21.1cm; transform:scale(-1,-1); }
  .panggung{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    text-shadow:0 0.12cm 0.5cm rgba(0,0,0,.92), 0 0 1.4cm rgba(0,0,0,.8);
  }
  .medali{
    width:9.6cm; height:9.6cm; border-radius:50%;
    border:0.12cm solid #d9b24c;
    box-shadow:0 0 0 0.18cm rgba(20,16,6,.55), 0 0.2cm 1cm rgba(0,0,0,.9), inset 0 0 1.2cm rgba(0,0,0,.55);
    background:radial-gradient(circle at 38% 32%, #2a2414, #0d0b06 72%);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:1.3cm;
  }
  .medali img{ width:7.6cm; height:auto; }
  .judulbaris{ display:flex; align-items:center; gap:1.6cm; }
  .judulbaris .garis{ width:8.5cm; height:0.07cm; }
  .judulbaris .kiri{ background:linear-gradient(90deg,transparent,#c9a243); }
  .judulbaris .kanan{ background:linear-gradient(90deg,#c9a243,transparent); }
  .judul{ color:#e6c260; font-size:3.3cm; font-weight:700; letter-spacing:1.05cm; text-indent:1.05cm; }
  .atas{ color:#f4efe2; font-size:2.15cm; font-style:italic; margin-top:0.85cm; }
  .nama{ color:#ffffff; font-size:6.9cm; font-weight:700; letter-spacing:0.3cm; margin-top:1cm; line-height:1.04; }
  .istri{ color:#f4efe2; font-size:2.6cm; font-style:italic; margin-top:1cm; }
  .pemisah{ display:flex; align-items:center; gap:0.9cm; margin-top:1.6cm; }
  .pemisah .l{ width:12cm; height:0.09cm; background:linear-gradient(90deg,transparent,#d9b24c); }
  .pemisah .r{ width:12cm; height:0.09cm; background:linear-gradient(90deg,#d9b24c,transparent); }
  .pemisah .d{ width:0.6cm; height:0.6cm; background:#d9b24c; transform:rotate(45deg); box-shadow:0 0 0.5cm rgba(217,178,76,.5); }
  .kb{ color:#f4efe2; font-size:2.2cm; font-style:italic; margin-top:1.5cm; }
  .org{ color:#e6c260; font-size:3.35cm; font-weight:700; letter-spacing:0.45cm; margin-top:0.55cm; }
  .resmi{ color:#d8d2c2; font-size:1.55cm; letter-spacing:0.16cm; margin-top:0.6cm; }
</style>
  <meta name="robots" content="noindex,nofollow">
  <title>Cetak Papan Eksklusif — Alat Internal GMPI</title>
</head>
<body>
  <div class="biasa"></div>
  <svg class="fil tl" viewBox="0 0 100 100">
    <g>
      <path d="M2 98 V30 Q2 2 30 2 H98" stroke-width="2.4"/>
      <path d="M13 98 V36 Q13 13 36 13 H98" stroke-width="1.2" opacity=".7"/>
      <path d="M26 46 q10 -4 8 -14 q-10 4 -8 14 z" stroke-width="1.6"/>
      <rect x="29.2" y="29.2" width="7" height="7" transform="rotate(45 32.7 32.7)" fill="#d9b24c" stroke="none"/>
    </g>
  </svg>
  <svg class="fil tr" viewBox="0 0 100 100"><g><path d="M2 98 V30 Q2 2 30 2 H98" stroke-width="2.4"/><path d="M13 98 V36 Q13 13 36 13 H98" stroke-width="1.2" opacity=".7"/><path d="M26 46 q10 -4 8 -14 q-10 4 -8 14 z" stroke-width="1.6"/><rect x="29.2" y="29.2" width="7" height="7" transform="rotate(45 32.7 32.7)" fill="#d9b24c" stroke="none"/></g></svg>
  <svg class="fil bl" viewBox="0 0 100 100"><g><path d="M2 98 V30 Q2 2 30 2 H98" stroke-width="2.4"/><path d="M13 98 V36 Q13 13 36 13 H98" stroke-width="1.2" opacity=".7"/><path d="M26 46 q10 -4 8 -14 q-10 4 -8 14 z" stroke-width="1.6"/><rect x="29.2" y="29.2" width="7" height="7" transform="rotate(45 32.7 32.7)" fill="#d9b24c" stroke="none"/></g></svg>
  <svg class="fil br" viewBox="0 0 100 100"><g><path d="M2 98 V30 Q2 2 30 2 H98" stroke-width="2.4"/><path d="M13 98 V36 Q13 13 36 13 H98" stroke-width="1.2" opacity=".7"/><path d="M26 46 q10 -4 8 -14 q-10 4 -8 14 z" stroke-width="1.6"/><rect x="29.2" y="29.2" width="7" height="7" transform="rotate(45 32.7 32.7)" fill="#d9b24c" stroke="none"/></g></svg>
  <div class="panggung">
    <div class="medali"><img src="uploads/Logo-GMPI-Sidoarjo-Eksklusif (1).png" alt=""></div>
    <div class="judulbaris"><span class="garis kiri"></span><span class="judul">TURUT BERDUKA CITA</span><span class="garis kanan"></span></div>
    <div class="atas">atas meninggalnya</div>
    <div class="nama">Ibu NUR MASFIATI</div>
    <div class="istri">Istri dari Gus Heru</div>
    <div class="pemisah"><span class="l"></span><span class="d"></span><span class="r"></span></div>
    <div class="kb">Keluarga Besar</div>
    <div class="org">DPD GMPI KABUPATEN SIDOARJO</div>
    <div class="resmi">Dewan Pimpinan Daerah &middot; Gerakan Militansi Pejuang Indonesia</div>
  </div>
</body>
</html>
