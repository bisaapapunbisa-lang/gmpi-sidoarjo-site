<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page{ size:200cm 100cm; margin:0; }
  html,body{ margin:0; padding:0; width:200cm; height:100cm; overflow:hidden; }
  body{
    position:relative;
    background:#000 url('assets/papan-frame-print.png') center/cover no-repeat;
    font-family:'Liberation Serif',Georgia,'Times New Roman',serif;
  }
  .panggung{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    text-shadow:0 0.12cm 0.5cm rgba(0,0,0,.9), 0 0 1.4cm rgba(0,0,0,.75);
  }
  .logo{ height:8.2cm; width:auto; margin-bottom:1.1cm; filter:drop-shadow(0 0.15cm 0.7cm rgba(0,0,0,.9)); }
  .judul{ color:#e4bf58; font-size:3.4cm; font-weight:700; letter-spacing:1.15cm; text-indent:1.15cm; }
  .atas{ color:#f4efe2; font-size:2.15cm; font-style:italic; margin-top:0.7cm; }
  .nama{ color:#ffffff; font-size:6.6cm; font-weight:700; letter-spacing:0.28cm; margin-top:0.9cm; line-height:1.04; }
  .istri{ color:#f4efe2; font-size:2.6cm; font-style:italic; margin-top:0.9cm; }
  .pemisah{ display:flex; align-items:center; gap:0.9cm; margin-top:1.5cm; }
  .pemisah .l{ width:11cm; height:0.09cm; background:linear-gradient(90deg,transparent,#d9b24c); }
  .pemisah .r{ width:11cm; height:0.09cm; background:linear-gradient(90deg,#d9b24c,transparent); }
  .pemisah .d{ width:0.62cm; height:0.62cm; background:#d9b24c; transform:rotate(45deg); }
  .kb{ color:#f4efe2; font-size:2.2cm; font-style:italic; margin-top:1.4cm; }
  .org{ color:#e4bf58; font-size:3.3cm; font-weight:700; letter-spacing:0.42cm; margin-top:0.5cm; }
  .resmi{ color:#ded8c8; font-size:1.55cm; letter-spacing:0.14cm; margin-top:0.55cm; }
</style>
  <meta name="robots" content="noindex,nofollow">
  <title>Cetak Papan Bunga — Alat Internal GMPI</title>
</head>
<body>
  <div class="panggung">
    <img class="logo" src="uploads/Logo-GMPI-Sidoarjo-Eksklusif (1).png" alt="">
    <div class="judul">TURUT BERDUKA CITA</div>
    <div class="atas">atas meninggalnya</div>
    <div class="nama">Ibu NUR MASFIATI</div>
    <div class="istri">Istri dari Gus Heru</div>
    <div class="pemisah"><span class="l"></span><span class="d"></span><span class="r"></span></div>
    <div class="kb">Keluarga Besar</div>
    <div class="org">DPD GMPI KABUPATEN SIDOARJO</div>
    <div class="resmi">Dewan Pimpinan Daerah &middot; Gerakan Masyarakat Pembangunan Indonesia</div>
  </div>
</body>
</html>
